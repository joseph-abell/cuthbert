<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>St Cuthbert Gospel — Replica Page Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#3a332b;
    --ink:#ece5d8; --muted:#a89d8e; --accent:#c9a468;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:14px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(#1c1815,#14110e)}
  header h1{margin:0;font:600 15px/1.3 Georgia,"Times New Roman",serif;letter-spacing:.04em}
  header p{margin:0;color:var(--muted);font-size:12px}
  main{display:grid;grid-template-columns:392px minmax(0,1fr);height:calc(100dvh - 56px)}
  form{overflow:auto;padding:16px 18px 48px;border-right:1px solid var(--line);background:var(--panel)}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 14px;margin:0 0 14px;background:var(--panel2)}
  legend{padding:0 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  label{display:block;margin:9px 0 0;font-size:11.5px;color:var(--muted)}
  label.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:12.5px;margin-top:11px}
  input[type=text],input[type=number],select,textarea{width:100%;margin-top:4px;background:#100e0c;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
  input[type=color]{width:100%;height:32px;margin-top:4px;background:#100e0c;border:1px solid var(--line);border-radius:7px;padding:2px}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,164,104,.45);outline-offset:1px}
  textarea{min-height:240px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;white-space:pre}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .hint{margin:0 0 6px;font-size:11.5px;color:var(--muted)}
  .hint code{background:#100e0c;border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
  button,.btn{appearance:none;border:1px solid var(--line);background:#26211c;color:var(--ink);
    border-radius:8px;padding:8px 13px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block}
  button:hover,.btn:hover{background:#312a23;border-color:#4a4036}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1a1409;font-weight:600}
  button.primary:hover{background:#d8b47a}
  .btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
  .status{margin:0;font-size:12px;color:var(--muted)}
  .warn{margin:8px 0 0;font-size:12px;color:#e8b36b;background:rgba(232,179,107,.08);
    border:1px solid rgba(232,179,107,.3);border-radius:8px;padding:8px 10px}
  .preview{padding:16px;background:#0c0b0a;display:grid}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
  @media (max-width:900px){
    main{grid-template-columns:1fr;height:auto}
    form{border-right:0;border-bottom:1px solid var(--line)}
    .preview{height:72vh;padding:10px}
  }
</style>
</head>
<body>
<header>
  <h1>St&nbsp;Cuthbert&nbsp;Gospel — replica page generator</h1>
  <p>92 × 138 mm pages (1 : 1.5) · mirrored margins · Add MS 89000</p>
</header>

<main>
  <form id="form" autocomplete="off" onsubmit="return false">
    <fieldset>
      <legend>Title page</legend>
      <label class="check"><input type="checkbox" id="titlePage" checked> Include a title page</label>
      <label>Title<input type="text" id="tTitle" value="The Gospel of John"></label>
      <label>Subtitle<input type="text" id="tSub" value="Replica of the St Cuthbert Gospel"></label>
      <label>Byline / scribe<input type="text" id="tBy" value="Written at Monkwearmouth–Jarrow"></label>
      <label>Place<input type="text" id="tPlace" value="Lindisfarne"></label>
      <label>Date<input type="text" id="tDate" value="c. AD 700"></label>
    </fieldset>

    <fieldset>
      <legend>Content — Markdown</legend>
      <p class="hint">Each <code>#</code> heading starts a new page. <code>##</code>/<code>###</code> are subheads,
        <code>&gt;</code> quotes, <code>-</code> lists, <code>\pagebreak</code> forces a page break.</p>
      <textarea id="md" spellcheck="false"></textarea>
    </fieldset>

    <fieldset>
      <legend>Page layout</legend>
      <label>Print scale
        <select id="scale">
          <option value="1" selected>1× — 92 × 138 mm (actual size)</option>
          <option value="1.5">1.5× — 138 × 207 mm</option>
          <option value="2">2× — 184 × 276 mm</option>
          <option value="2.5">2.5× — 230 × 345 mm</option>
        </select>
      </label>
      <div class="row3">
        <label>Body (pt)<input type="number" id="bodySize" step="0.1" min="5" max="16" value="8.4"></label>
        <label>Leading<input type="number" id="lead" step="0.05" min="1" max="2.5" value="1.55"></label>
        <label>1st-line ind.<input type="number" id="firstIndent" step="0.5" min="0" max="8" value="0"></label>
      </div>
      <div class="row4">
        <label>Top<input type="number" id="mTop" step="0.5" min="4" value="13"></label>
        <label>Bottom<input type="number" id="mBot" step="0.5" min="4" value="15"></label>
        <label>Inner<input type="number" id="mIn" step="0.5" min="4" value="14"></label>
        <label>Outer<input type="number" id="mOut" step="0.5" min="4" value="11"></label>
      </div>
      <label>Typeface
        <select id="font">
          <option value="times" selected>Times — built-in serif</option>
          <option value="helvetica">Helvetica — built-in sans</option>
          <option value="courier">Courier — built-in mono</option>
          <option value="unicode">DejaVu Serif — Unicode (downloaded)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="justify" checked> Justify text</label>
      <label class="check"><input type="checkbox" id="pageNums" checked> Page numbers</label>
      <label class="check"><input type="checkbox" id="chapterRecto"> Chapters open on a right-hand page</label>
      <label class="check"><input type="checkbox" id="upperTitles" checked> Titles in capitals</label>
      <div class="row2">
        <label>Ink<input type="color" id="ink" value="#1b1712"></label>
        <label>Paper<input type="color" id="paper" value="#f7f1e3"></label>
      </div>
      <label class="check"><input type="checkbox" id="paperOn"> Tint the page background</label>
    </fieldset>

    <div class="actions">
      <button type="button" class="primary" id="go">Generate PDF</button>
      <a class="btn" id="dl" download aria-disabled="true">Download</a>
      <button type="button" id="sample">Sample text</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <p class="status" id="status">Ready.</p>
    <p class="warn" id="warn" hidden></p>
  </form>

  <section class="preview"><iframe id="frame" title="PDF preview"></iframe></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const PT2MM = 25.4 / 72;
  const PAGE_W = 92;      // mm  — St Cuthbert Gospel
  const PAGE_H = 138;     // mm  — ratio 1 : 1.5
  const BULLET = '\u2022';
  const FONT_CDN = 'https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/';
  const state = { url: null, timer: null, fontCache: null };

  /* ------------------------------------------------------------------ *
   * Markdown — inline
   * ------------------------------------------------------------------ */
  function parseInline(src) {
    const out = [];
    let buf = '', bold = false, ital = false;
    const flush = () => { if (buf) { out.push({ t: buf, b: bold, i: ital }); buf = ''; } };
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      const prev = i ? src[i - 1] : ' ';
      if (c === '\\' && i + 1 < src.length) { flush(); buf += src[i + 1]; i += 2; continue; }
      if (c === '`') {
        const j = src.indexOf('`', i + 1);
        if (j > i + 1) { flush(); out.push({ t: src.slice(i + 1, j), mono: true, b: bold, i: ital }); i = j + 1; continue; }
      }
      if ((c === '*' || c === '_') && src[i + 1] === c) {
        if (c === '_' && /[A-Za-z0-9]/.test(src[i - 1] || '')) { buf += c; i++; continue; }
        flush(); bold = !bold; i += 2; continue;
      }
      if (c === '*' || c === '_') {
        if (c === '_' && /[A-Za-z0-9]/.test(src[i - 1] || '')) { buf += c; i++; continue; }
        flush(); ital = !ital; i++; continue;
      }
      buf += c; i++;
    }
    flush();
    return out;
  }

  const plain = s => parseInline(s).map(r => r.t).join('');

  /* ------------------------------------------------------------------ *
   * Markdown — blocks
   * ------------------------------------------------------------------ */
  function parseMarkdown(md) {
    const lines = md.replace(/\r\n?/g, '\n').split('\n');
    const blocks = [];
    let para = [], i = 0;
    const flushPara = () => { if (para.length) { blocks.push({ type: 'p', text: para.join(' ') }); para = []; } };

    while (i < lines.length) {
      const raw = lines[i];
      const t = raw.trim();

      if (t.startsWith('```')) {                       // fenced code
        flush();
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith('```')) buf.push(lines[i++]);
        i++;
        blocks.push({ type: 'code', text: buf.join(' ') });
        continue;
      }

      if (!t) { flush(); i++; continue; }

      if (/^(\\pagebreak|\[\[pagebreak\]\]|<!--\s*pagebreak\s*-->)$/i.test(t)) {
        flush(); blocks.push({ type: 'pagebreak' }); i++; continue;
      }

      if (/^(\*\s*){3,}$/.test(t) || /^(-\s*){3,}$/.test(t) || /^(_\s*){3,}$/.test(t)) {
        flush(); blocks.push({ type: 'hr' }); i++; continue;
      }

      const h = /^(#{1,6})\s+(.+?)\s*#*\s*$/.exec(t);
      if (h) {
        flush();
        blocks.push({ type: 'h' + Math.min(h[1].length, 3), text: h[2] });
        i++; continue;
      }

      if (/^\s*>\s?/.test(src(raw))) {
        flush();
        const buf = [];
        while (i < src.length && /^\s*>\s?/.test(raw)) {
          buf.push(raw.trim().replace(/^>\s?/, ''));
          i++; break;
        }
      }
      else if (/^\s*>\s?/.test(src(src.line))) {
        // placeholder
      }

      const li = /^(\s*)([-+*]|\d+[.)])\s+(.*)$/.exec(src);
      // (list handling below)
      i = i;
      i = i;
      if (false) {}
      break;
    }
    return out;
  }
</script>
</body>
</html>
